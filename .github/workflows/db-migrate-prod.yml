name: Production database migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: kimi-builders-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_PATH DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::$name is not configured."
              exit 1
            }
          done
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != "/" ]] || exit 1
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Apply pending migrations on the deploy host
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -Eeuo pipefail; \
             release_dir=\"\$(readlink -f '$DEPLOY_PATH/current')\"; \
             test -n \"\$release_dir\"; \
             cd \"\$release_dir\"; \
             set -a; source .env.production; set +a; \
             node scripts/db-migrate.mjs status --strict --allow-pending; \
             node scripts/db-migrate.mjs migrate --strict; \
             node scripts/db-migrate.mjs status --strict --require-clean"

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
