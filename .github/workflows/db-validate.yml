name: Database validation

on:
  workflow_call:
    inputs:
      base_ref:
        description: Commit that represents the pre-deploy database shape
        required: true
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kimi-builders-db-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: mysql://root@127.0.0.1:3306/kbu-mysql
  USAGE_KEY_PEPPER: ci-only-usage-pepper-at-least-32-characters

jobs:
  migration-integrity:
    name: Migration immutability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Resolve base revision
        id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          base_ref="${INPUT_BASE_REF:-${PR_BASE_SHA:-}}"
          if [[ "$base_ref" =~ ^0{40}$ ]]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          [[ "$base_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::A full base commit SHA is required."
            exit 1
          }
          git cat-file -e "$base_ref^{commit}"
          echo "ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Reject edits to applied migrations
        run: node scripts/check-migration-immutability.mjs "${{ steps.base.outputs.ref }}"

  fresh-install:
    name: Fresh schema and DB suites
    needs: migration-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "1"
          MYSQL_DATABASE: kbu-mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap terminal schema
        run: |
          set -Eeuo pipefail
          mysql -h127.0.0.1 -uroot kbu-mysql < db/schema.sql
          node scripts/db-migrate.mjs init-ledger --fresh-schema
          node scripts/db-migrate.mjs status --strict --require-clean

      - name: Unit tests
        run: npm test

      - name: Database integration suites
        run: |
          set -Eeuo pipefail
          npm run test:usage-db
          npm run test:analytics-db
          npm run test:auth-db
          npm run test:works-db
          npm run test:moderation-db

  upgrade-path:
    name: Upgrade and schema parity
    needs: migration-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "1"
          MYSQL_DATABASE: kbu-mysql-upgrade
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build migration baseline and terminal databases
        run: |
          set -Eeuo pipefail
          first_migration_commit="$(git log --diff-filter=A --format='%H' -- db/migrations | tail -1)"
          [[ "$first_migration_commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git show "$first_migration_commit^:db/schema.sql" > /tmp/migration-baseline.sql

          mysql -h127.0.0.1 -uroot -e \
            'ALTER DATABASE `kbu-mysql-upgrade` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h127.0.0.1 -uroot kbu-mysql-upgrade < /tmp/migration-baseline.sql

          mysql -h127.0.0.1 -uroot -e 'CREATE DATABASE `kbu-mysql-fresh` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h127.0.0.1 -uroot kbu-mysql-fresh < db/schema.sql
          DATABASE_URL='mysql://root@127.0.0.1:3306/kbu-mysql-fresh' \
            node scripts/db-migrate.mjs init-ledger --fresh-schema

      - name: Replay every migration from the historical baseline
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/kbu-mysql-upgrade
        run: |
          set -Eeuo pipefail
          node scripts/db-migrate.mjs migrate --strict
          node scripts/db-migrate.mjs status --strict --require-clean

      - name: Compare upgraded and terminal schemas
        env:
          FRESH_DATABASE_URL: mysql://root@127.0.0.1:3306/kbu-mysql-fresh
          UPGRADE_DATABASE_URL: mysql://root@127.0.0.1:3306/kbu-mysql-upgrade
        run: node scripts/db-compare-schemas.mjs
