<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- ============================================================
    kimi.builders community mark · master v2 "dark side of the moon,
    twin stars side by side". Original design; no Kimi official logo
    assets are used.

    Design semantics (carried by the geometry itself, not by narrative):
      moon       = the dark side / the uncharted territory of AGI
      crescent   = a beam of light refracted into the dark; the bite
                   line = the not-yet-calibrated crack in truth
      earthshine = the dark side faintly lit near the crack (real
                   astronomy: earthshine)
      craters    = the dark side is not flat — the unknown has texture
      blue star  = Kimi (brand blue #1783FF)
      paper star = builders (same color as the crescent, #EFE8DC — a
                   mote of light setting out from the crack)
      twin stars on one orbit, adjacent, equal size = exploring
      beside Kimi; the paper star leads by one small step along the
      track

    Parametric spec (the single source of truth for animation/video):
      moon:    center M=(500,480)  R=270
      orbit:   center M, rx=408, ry=131, x-rotation=-14deg
      point(theta) = M + Rot(-14deg) · (rx·cosθ, ry·sinθ)
      blue star θ=-27°  paper star θ=-14°  (Δθ=13° constant = side by
      side)
      Animation contract: both stars travel #orbit-motion at the same
      angular speed in the direction of increasing θ, 8s period; the
      paper star leads the blue star by 13° (begin offset -0.289s);
      earthshine breathes 0.72↔1 over the same period.

    Orbit occlusion (Saturn-ring relation): the orbit crosses the
    lunar disc at θ≈52.3° / 127.7°.
      The far arc (θ∈[127.7°,332.3°], passing behind the moon) sits
      under the moon;
      the near arc #orbit-near (θ∈[52.3°,127.7°], sweeping across the
      lower front of the disc) is drawn above the moon and below the
      stars — stars ride on the line, occlusion stays consistent.
      In the animation both stars are briefly hidden by the moon
      inside the far arc (blue 5.76–7.44s, paper 5.47–7.15s), rising
      again from behind the lunar rim.
  ============================================================ -->
  <defs>
    <mask id="crescent-cut">
      <circle cx="500" cy="480" r="270" fill="#fff"/>
      <circle cx="451" cy="459" r="256" fill="#000"/>
    </mask>
    <radialGradient id="earthshine" gradientUnits="userSpaceOnUse" cx="301" cy="395" r="330">
      <stop offset="0" stop-color="#EFE8DC" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#EFE8DC" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#EFE8DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crescent-light" gradientUnits="userSpaceOnUse" x1="748" y1="586" x2="680" y2="555">
      <stop offset="0" stop-color="#F9F4EA"/>
      <stop offset="1" stop-color="#ECE4D5"/>
    </linearGradient>
    <!-- Animation motion path: the full orbit starting at the blue star's
         position (θ=-27°); relative displacement, composable onto the
         static coordinates. -->
    <path id="orbit-motion" d="m 0 0 a 408 131 -14 1 1 -676.6 291.2 a 408 131 -14 1 1 676.6 -291.2" fill="none"/>
  </defs>

  <g id="orbit">
    <ellipse cx="500" cy="480" rx="408" ry="131" transform="rotate(-14 500 480)"
             fill="none" stroke="#EFE8DC" stroke-opacity="0.26" stroke-width="1.8"/>
  </g>

  <g id="moon">
    <circle id="moon-disc" cx="500" cy="480" r="270" fill="#1B1B25"
            stroke="#EFE8DC" stroke-opacity="0.07" stroke-width="2.3"/>
    <circle id="moon-earthshine" cx="500" cy="480" r="270" fill="url(#earthshine)"/>
    <g id="moon-terrain" stroke="#EFE8DC" stroke-opacity="0.07" stroke-width="2" fill="none">
      <circle cx="400" cy="380" r="46"/>
      <circle cx="330" cy="500" r="30"/>
      <circle cx="470" cy="300" r="24"/>
    </g>
  </g>

  <g id="crescent">
    <circle cx="500" cy="480" r="270" fill="url(#crescent-light)" mask="url(#crescent-cut)"/>
  </g>

  <!-- Near arc: the segment where the orbit crosses the moon's front
       (θ 52.3°→127.7°). -->
  <g id="orbit-near">
    <path d="M 767.0 520.3 A 408 131 -14 0 1 283.2 640.9" fill="none"
          stroke="#EFE8DC" stroke-opacity="0.26" stroke-width="1.8"/>
  </g>

  <g id="star-blue">
    <circle cx="838.3" cy="334.4" r="21" fill="#1783FF" opacity="0.16"/>
    <circle cx="838.3" cy="334.4" r="10.5" fill="#1783FF"/>
  </g>
  <g id="star-paper">
    <circle cx="876.5" cy="353.5" r="21" fill="#EFE8DC" opacity="0.10"/>
    <circle cx="876.5" cy="353.5" r="10.5" fill="#EFE8DC"/>
  </g>
</svg>
