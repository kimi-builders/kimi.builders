<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- ============================================================
    kimi.builders mark, animated demo (SMIL; opens and plays directly
    in browsers). Same parameters as public/brand/logo-mark.svg;
    animation semantics:
      · both stars travel the orbit at the same angular speed
        (increasing θ), 8s period
      · Δθ=13° constant — the paper star always leads the blue star by
        one step: "side by side" is not a formation change, it is
        constant companionship
      · earthshine breathes 0.72↔1 over the same period — light keeps
        reaching into the dark side
    Remaking this as video (AE etc.) defers to this file's parameter
    comments plus the logo-mark.svg spec; the occlusion (stars passing
    behind the moon) may use true 3D occlusion in video — in the logo
    loop the stars are always in front.
  ============================================================ -->
  <defs>
    <mask id="crescent-cut">
      <circle cx="500" cy="480" r="270" fill="#fff"/>
      <circle cx="451" cy="459" r="256" fill="#000"/>
    </mask>
    <radialGradient id="earthshine" gradientUnits="userSpaceOnUse" cx="301" cy="395" r="330">
      <stop offset="0" stop-color="#EFE8DC" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#EFE8DC" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#EFE8DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crescent-light" gradientUnits="userSpaceOnUse" x1="748" y1="586" x2="680" y2="555">
      <stop offset="0" stop-color="#F9F4EA"/>
      <stop offset="1" stop-color="#ECE4D5"/>
    </linearGradient>
    <path id="orbit-motion" d="m 0 0 a 408 131 -14 1 1 -676.6 291.2 a 408 131 -14 1 1 676.6 -291.2" fill="none"/>
  </defs>

  <rect width="1000" height="1000" fill="#0E0E13"/>

  <g id="orbit">
    <ellipse cx="500" cy="480" rx="408" ry="131" transform="rotate(-14 500 480)"
             fill="none" stroke="#EFE8DC" stroke-opacity="0.26" stroke-width="1.8"/>
  </g>

  <g id="moon">
    <circle id="moon-disc" cx="500" cy="480" r="270" fill="#1B1B25"
            stroke="#EFE8DC" stroke-opacity="0.07" stroke-width="2.3"/>
    <circle id="moon-earthshine" cx="500" cy="480" r="270" fill="url(#earthshine)">
      <animate attributeName="opacity" values="0.72;1;0.72" keyTimes="0;0.5;1"
               dur="8s" repeatCount="indefinite"/>
    </circle>
    <g id="moon-terrain" stroke="#EFE8DC" stroke-opacity="0.07" stroke-width="2" fill="none">
      <circle cx="400" cy="380" r="46"/>
      <circle cx="330" cy="500" r="30"/>
      <circle cx="470" cy="300" r="24"/>
    </g>
  </g>

  <g id="crescent">
    <circle cx="500" cy="480" r="270" fill="url(#crescent-light)" mask="url(#crescent-cut)"/>
  </g>

  <g id="orbit-near">
    <path d="M 767.0 520.3 A 408 131 -14 0 1 283.2 640.9" fill="none"
          stroke="#EFE8DC" stroke-opacity="0.26" stroke-width="1.8"/>
  </g>

  <g id="star-blue">
    <animateMotion dur="8s" repeatCount="indefinite" begin="0s">
      <mpath href="#orbit-motion"/>
    </animateMotion>
    <!-- Occluded by the moon while passing behind it (far arc
         θ∈[232.3°,307.7°]): fades out 0.18s before reaching the lunar
         rim, fades back in 0.18s after leaving it. -->
    <animate attributeName="opacity" values="1;1;0;0;1;1"
             keyTimes="0;0.6979;0.7204;0.9296;0.9321;1"
             dur="8s" repeatCount="indefinite"/>
    <circle cx="838.3" cy="334.4" r="21" fill="#1783FF" opacity="0.16"/>
    <circle cx="838.3" cy="334.4" r="10.5" fill="#1783FF"/>
  </g>
  <g id="star-paper">
    <animateMotion dur="8s" repeatCount="indefinite" begin="-0.289s">
      <mpath href="#orbit-motion"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0;1;1"
             keyTimes="0;0.6618;0.6843;0.8935;0.9160;1"
             dur="8s" repeatCount="indefinite"/>
    <circle cx="876.5" cy="353.5" r="21" fill="#EFE8DC" opacity="0.10"/>
    <circle cx="876.5" cy="353.5" r="10.5" fill="#EFE8DC"/>
  </g>
</svg>
